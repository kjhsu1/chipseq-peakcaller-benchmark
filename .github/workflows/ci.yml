name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pandas numpy scipy pyyaml requests

      - name: Run pytest and generate report
        run: |
          mkdir -p reports
          for project in chipseq_pipeline_v2 chipseq_pipeline_v2_realstudy; do
            (cd "$project" && pytest -q tests --junitxml=../reports/"${project}"-pytest-results.xml)
          done

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: reports/
